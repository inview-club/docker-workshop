# Based on goharbor/harbor v2.14.0 official Compose template (Apache-2.0).
# Local workshop: relative storage, loopback HTTP, amd64 emulation.
name: harbor-lab
services:
  log:
    platform: linux/amd64
    image: goharbor/harbor-log:v2.14.0
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ./runtime/log/:/var/log/docker/:z
      - type: bind
        source: ./runtime/common/config/log/logrotate.conf
        target: /etc/logrotate.d/logrotate.conf
      - type: bind
        source: ./runtime/common/config/log/rsyslog_docker.conf
        target: /etc/rsyslog.d/rsyslog_docker.conf
    ports:
      - 127.0.0.1:1514:10514
    networks:
      - harbor
  registry:
    platform: linux/amd64
    image: goharbor/registry-photon:v2.14.0
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./runtime/data/registry:/storage:z
      - ./runtime/common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./runtime/data/secret/registry/root.crt
        target: /etc/registry/root.crt
      - type: bind
        source: ./runtime/common/config/shared/trust-certificates
        target: /harbor_cust_cert


    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "registry"
  registryctl:
    platform: linux/amd64
    image: goharbor/harbor-registryctl:v2.14.0
    env_file:
      - ./runtime/common/config/registryctl/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./runtime/data/registry:/storage:z
      - ./runtime/common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./runtime/common/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./runtime/common/config/shared/trust-certificates
        target: /harbor_cust_cert


    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "registryctl"

  postgresql:
    platform: linux/amd64
    image: goharbor/harbor-db:v2.14.0
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ./runtime/data/database:/var/lib/postgresql/data:z
    networks:
      harbor:
    env_file:
      - ./runtime/common/config/db/env
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "postgresql"
    shm_size: '1gb'

  core:
    platform: linux/amd64
    image: goharbor/harbor-core:v2.14.0
    env_file:
      - ./runtime/common/config/core/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - ./runtime/data/ca_download/:/etc/core/ca/:z
      - ./runtime/data/:/data/:z
      - ./runtime/common/config/core/certificates/:/etc/core/certificates/:z
      - type: bind
        source: ./runtime/common/config/core/app.conf
        target: /etc/core/app.conf
      - type: bind
        source: ./runtime/data/secret/core/private_key.pem
        target: /etc/core/private_key.pem
      - type: bind
        source: ./runtime/data/secret/keys/secretkey
        target: /etc/core/key
      - type: bind
        source: ./runtime/common/config/shared/trust-certificates
        target: /harbor_cust_cert


    networks:
      harbor:
    depends_on:
      - log
      - registry

      - redis


      - postgresql

    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "core"
  portal:
    platform: linux/amd64
    image: goharbor/harbor-portal:v2.14.0
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - type: bind
        source: ./runtime/common/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf

    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "portal"

  jobservice:
    platform: linux/amd64
    image: goharbor/harbor-jobservice:v2.14.0
    env_file:
      - ./runtime/common/config/jobservice/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./runtime/data/job_logs:/var/log/jobs:z
      - type: bind
        source: ./runtime/common/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./runtime/common/config/shared/trust-certificates
        target: /harbor_cust_cert

    networks:
      - harbor
    depends_on:
      - core
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "jobservice"

  redis:
    platform: linux/amd64
    image: goharbor/redis-photon:v2.14.0
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./runtime/data/redis:/var/lib/redis
    networks:
      harbor:
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "redis"

  proxy:
    platform: linux/amd64
    image: goharbor/nginx-photon:v2.14.0
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./runtime/common/config/nginx:/etc/nginx:z

      - type: bind
        source: ./runtime/common/config/shared/trust-certificates
        target: /harbor_cust_cert

    networks:
      - harbor
    ports:
      - 127.0.0.1:8081:8080


    depends_on:
      - registry
      - core
      - portal
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "proxy"

  trivy-adapter:
    platform: linux/amd64
    image: goharbor/trivy-adapter-photon:v2.14.0
    restart: always
    cap_drop:
      - ALL
    depends_on:
      - log

      - redis

    networks:
      - harbor
    volumes:
      - type: bind
        source: ./runtime/data/trivy-adapter/trivy
        target: /home/scanner/.cache/trivy
      - type: bind
        source: ./runtime/data/trivy-adapter/reports
        target: /home/scanner/.cache/reports
      - type: bind
        source: ./runtime/common/config/shared/trust-certificates
        target: /harbor_cust_cert

    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "trivy-adapter"
    env_file:
      ./runtime/common/config/trivy-adapter/env


networks:
  harbor:
    external: false
